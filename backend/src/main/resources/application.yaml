spring:
  application:
    name: SmartCommunity

  datasource:
      url: ${SPRING_DATASOURCE_URL}
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}
      driver-class-name:
        org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
      host: smtp-relay.brevo.com
      port: 587
      username: ${BREVO_SMTP_LOGIN}
      password: ${BREVO_SMTP_KEY}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true

jwt:
  secret: ${JWT_SECRET_BASE64}
  access-expiration: 900000

app:
  cors:
    # Frontend URLs allowed to call this API (comma separated). Change to your frontend's URL.
    allowed-origins: http://localhost:5173,http://localhost:3000